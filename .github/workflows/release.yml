name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 cmdline-tools;latest'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Linux x86_64 build
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux x86_64" build/linux/psz-godot.x86_64

      - name: Export Windows x86_64 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x86_64" build/windows/psz-godot.exe

      - name: Export Android build
        continue-on-error: true
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/psz-godot.apk

      - name: Package builds
        run: |
          cd build/web && zip -r ../../psz-godot-web.zip . && cd ../..
          cd build/linux && zip -r ../../psz-godot-linux-x86_64.zip . && cd ../..
          cd build/windows && zip -r ../../psz-godot-windows-x86_64.zip . && cd ../..

      - name: Collect APK if built
        id: apk
        run: |
          if [ -f build/android/psz-godot.apk ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-windows-x86_64.zip
            ${{ steps.apk.outputs.exists == 'true' && 'build/android/psz-godot.apk' || '' }}
          generate_release_notes: true

      - name: Upload build (no version bump)
        if: steps.check_tag.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-windows-x86_64.zip
            ${{ steps.apk.outputs.exists == 'true' && 'build/android/psz-godot.apk' || '' }}
          generate_release_notes: true
