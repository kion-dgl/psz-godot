name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check asset references match published pack
        run: python3 scripts/tools/check_asset_refs.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 cmdline-tools;latest ndk;26.3.11579264'

      - name: Decode release keystore from secret
        # Stable PKCS12 keystore from `ANDROID_KEYSTORE_B64` secret. Generated
        # locally once with `keytool -genkeypair -keyalg RSA -keysize 4096
        # -validity 10000` (see docs/SECRETS.md). Re-using the same keystore
        # across CI runs means released APKs install as upgrades over previous
        # ones — previously every CI run minted a fresh debug keystore, so
        # every install required uninstall+reinstall (lost save data).
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret not set. See docs/SECRETS.md."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > ~/.android/psz-release.keystore
          chmod 600 ~/.android/psz-release.keystore
          # Smoke-check: PKCS12 magic bytes are 30 82 (DER SEQUENCE).
          head -c 2 ~/.android/psz-release.keystore | xxd | grep -q '3082' \
            || { echo "::error::Decoded keystore is not a valid PKCS12 file"; exit 1; }

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import', 'asset_tree.txt') }}
          restore-keys: godot-import-

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.5.1

      - name: Fetch assets for UID table
        # exclude_filter drops the actual asset bytes from the exe, but the
        # uid_cache.bin still needs entries for every res://assets/ path or
        # runtime UID-based lookups fail with "Cannot get class ''" after the
        # separately-delivered pack mounts (root cause of #158 / #160 on CI
        # builds where assets/ was otherwise never present at export time).
        run: bash scripts/tools/fetch_assets_dev.sh

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Configure Godot editor settings for Android
        # Only inject SDK/Java paths here. The release keystore is supplied to
        # Godot via the GODOT_ANDROID_KEYSTORE_RELEASE_* env vars on the export
        # step (added in 4.4+, see godotengine/godot#35930) — that keeps the
        # passphrase out of the editor settings file.
        run: |
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.5.tres"
          if [ ! -f "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.tres"
          fi
          sed -i '/\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_HOME"'"\nexport/android/java_sdk_path = "'"$JAVA_HOME"'"' "$SETTINGS_FILE"
          grep -i "android\|java" "$SETTINGS_FILE"

      - name: Diagnose Android SDK setup
        run: |
          echo "=== Editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.tres" || echo "Settings file not found"
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== adb ==="
          which adb || echo "adb not in PATH"
          echo "=== aapt2 ==="
          find "$ANDROID_HOME" -name aapt2 2>/dev/null | head -5 || echo "aapt2 not found"
          echo "=== NDK ==="
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "No NDK directory found"
          echo "=== build-tools ==="
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "No build-tools found"

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Linux x86_64 build
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux x86_64" build/linux/psz-godot.x86_64

      - name: Export Linux arm64 build
        continue-on-error: true
        run: |
          mkdir -p build/linux-arm64
          godot --headless --path . --export-release "Linux arm64" build/linux-arm64/psz-godot.arm64

      - name: Export Windows x86_64 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x86_64" build/windows/psz-godot.exe

      - name: Export Android build
        # Release-signed with the stable keystore decoded earlier. Godot reads
        # the keystore path/alias/password from GODOT_ANDROID_KEYSTORE_RELEASE_*
        # env vars (4.4+), overriding the empty values committed in
        # export_presets.cfg. Same keystore on every CI run = APKs install as
        # upgrades over previous releases without uninstall+reinstall.
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/psz-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: psz-release
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret not set. See docs/SECRETS.md."
            exit 1
          fi
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/psz-godot.apk
          # Pick the newest build-tools version (sort -V handles 34.0.0 vs 35.0.1
          # correctly). Fail explicitly if no apksigner is resolvable instead of
          # silently producing an unverified build.
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            ls -la "$ANDROID_HOME/build-tools" || true
            exit 1
          fi
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/android/psz-godot.apk | head -30
          # Independent cert SHA-256 via openssl — same value should appear in
          # docs/SECRETS.md (2B:95:17:1D:DB:22:...). A mismatch here means
          # the wrong keystore was used; that's worth eyeballing in CI logs.
          # TODO: once we've confirmed the apksigner output format in real CI,
          # tighten this to a hard fail on mismatch (see issue link in PR).
          echo "=== Independent cert fingerprint via openssl ==="
          unzip -p build/android/psz-godot.apk 'META-INF/*.RSA' \
            | openssl pkcs7 -inform DER -print_certs 2>/dev/null \
            | openssl x509 -fingerprint -sha256 -noout 2>/dev/null \
            || echo "(openssl cert dump failed — non-blocking)"

      - name: Export macOS build
        continue-on-error: true
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" build/macos/psz-godot.zip

      - name: Package builds
        run: |
          cd build/web && zip -r ../../psz-godot-web.zip . && cd ../..
          cd build/linux && zip -r ../../psz-godot-linux-x86_64.zip . && cd ../..
          [ -d build/linux-arm64 ] && cd build/linux-arm64 && zip -r ../../psz-godot-linux-arm64.zip . && cd ../.. || true
          cd build/windows && zip -r ../../psz-godot-windows-x86_64.zip . && cd ../..
          [ -f build/macos/psz-godot.zip ] && cp build/macos/psz-godot.zip psz-godot-macos.zip || true

      - name: Build release body (pack URL + sha)
        id: body
        run: |
          PACK_URL=$(python3 -c "import json; print(json.load(open('assets_manifest.json'))['pack']['urls'][0])")
          PACK_SHA=$(python3 -c "import json; print(json.load(open('assets_manifest.json'))['pack']['sha256'])")
          PACK_SIZE_MB=$(python3 -c "import json; print(f\"{json.load(open('assets_manifest.json'))['pack']['size']/1024/1024:.1f}\")")
          {
            echo "## Asset pack"
            echo ""
            echo "First launch downloads the shared asset pack (~${PACK_SIZE_MB} MB) from the CDN:"
            echo ""
            echo "- \`${PACK_URL}\`"
            echo "- sha256: \`${PACK_SHA}\`"
            echo ""
            echo "Fallback mirrors (Arweave) and verification sha live in"
            echo "[\`assets_manifest.json\`](../../blob/${{ github.sha }}/assets_manifest.json) and the release asset of the same name."
          } > release-body.md
          cat release-body.md

      - name: Upload Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          fail_on_missing_files: false
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-linux-arm64.zip
            psz-godot-windows-x86_64.zip
            psz-godot-macos.zip
            build/android/psz-godot.apk
            assets_manifest.json
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

      - name: Upload build (no version bump)
        if: steps.check_tag.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          fail_on_missing_files: false
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-linux-arm64.zip
            psz-godot-windows-x86_64.zip
            psz-godot-macos.zip
            build/android/psz-godot.apk
            assets_manifest.json
          body_path: release-body.md
          append_body: true
          generate_release_notes: true
