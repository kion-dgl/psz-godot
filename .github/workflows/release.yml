name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version tag already exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check asset references match published pack
        run: python3 scripts/tools/check_asset_refs.py

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 cmdline-tools;latest ndk;26.3.11579264'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.5.1

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Configure Godot editor settings for Android
        run: |
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.5.tres"
          if [ ! -f "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.tres"
          fi
          sed -i '/\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_HOME"'"\nexport/android/java_sdk_path = "'"$JAVA_HOME"'"\nexport/android/debug_keystore = "'"$HOME"'/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"' "$SETTINGS_FILE"
          grep -i "android\|java" "$SETTINGS_FILE"

      - name: Diagnose Android SDK setup
        run: |
          echo "=== Editor settings ==="
          cat "$HOME/.config/godot/editor_settings-4.tres" || echo "Settings file not found"
          echo "=== ANDROID_HOME: $ANDROID_HOME ==="
          echo "=== adb ==="
          which adb || echo "adb not in PATH"
          echo "=== aapt2 ==="
          find "$ANDROID_HOME" -name aapt2 2>/dev/null | head -5 || echo "aapt2 not found"
          echo "=== NDK ==="
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "No NDK directory found"
          echo "=== build-tools ==="
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "No build-tools found"

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Linux x86_64 build
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux x86_64" build/linux/psz-godot.x86_64

      - name: Export Linux arm64 build
        continue-on-error: true
        run: |
          mkdir -p build/linux-arm64
          godot --headless --path . --export-release "Linux arm64" build/linux-arm64/psz-godot.arm64

      - name: Export Windows x86_64 build
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x86_64" build/windows/psz-godot.exe

      - name: Export Android build
        # Use `--export-debug` so Godot signs with the debug keystore from
        # the editor-settings step above. `--export-release` without a
        # release keystore configured silently produces an unsigned APK
        # that can't be installed by adb (INSTALL_PARSE_FAILED_NO_CERTIFICATES).
        # End users sideload; no Play Store, no release-key requirement.
        run: |
          set -euo pipefail
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/psz-godot.apk
          # Pick the newest build-tools version (sort -V handles 34.0.0 vs 35.0.1
          # correctly). Fail explicitly if no apksigner is resolvable instead of
          # silently producing an unverified build.
          APKSIGNER=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            ls -la "$ANDROID_HOME/build-tools" || true
            exit 1
          fi
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --verbose build/android/psz-godot.apk | head -10

      - name: Export macOS build
        continue-on-error: true
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" build/macos/psz-godot.zip

      - name: Package builds
        run: |
          cd build/web && zip -r ../../psz-godot-web.zip . && cd ../..
          cd build/linux && zip -r ../../psz-godot-linux-x86_64.zip . && cd ../..
          [ -d build/linux-arm64 ] && cd build/linux-arm64 && zip -r ../../psz-godot-linux-arm64.zip . && cd ../.. || true
          cd build/windows && zip -r ../../psz-godot-windows-x86_64.zip . && cd ../..
          [ -f build/macos/psz-godot.zip ] && cp build/macos/psz-godot.zip psz-godot-macos.zip || true

      - name: Build release body (pack URL + sha)
        id: body
        run: |
          PACK_URL=$(python3 -c "import json; print(json.load(open('assets_manifest.json'))['pack']['urls'][0])")
          PACK_SHA=$(python3 -c "import json; print(json.load(open('assets_manifest.json'))['pack']['sha256'])")
          PACK_SIZE_MB=$(python3 -c "import json; print(f\"{json.load(open('assets_manifest.json'))['pack']['size']/1024/1024:.1f}\")")
          {
            echo "## Asset pack"
            echo ""
            echo "First launch downloads the shared asset pack (~${PACK_SIZE_MB} MB) from the CDN:"
            echo ""
            echo "- \`${PACK_URL}\`"
            echo "- sha256: \`${PACK_SHA}\`"
            echo ""
            echo "Fallback mirrors (Arweave) and verification sha live in"
            echo "[\`assets_manifest.json\`](../../blob/${{ github.sha }}/assets_manifest.json) and the release asset of the same name."
          } > release-body.md
          cat release-body.md

      - name: Upload Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          fail_on_missing_files: false
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-linux-arm64.zip
            psz-godot-windows-x86_64.zip
            psz-godot-macos.zip
            build/android/psz-godot.apk
            assets_manifest.json
          body_path: release-body.md
          append_body: true
          generate_release_notes: true

      - name: Upload build (no version bump)
        if: steps.check_tag.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          fail_on_missing_files: false
          files: |
            psz-godot-web.zip
            psz-godot-linux-x86_64.zip
            psz-godot-linux-arm64.zip
            psz-godot-windows-x86_64.zip
            psz-godot-macos.zip
            build/android/psz-godot.apk
            assets_manifest.json
          body_path: release-body.md
          append_body: true
          generate_release_notes: true
