name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Build web app
        # Every /assets/* path is routed through
        # VITE_ASSETS_BASE at build time (see web/src/utils/assets.ts),
        # so no raw asset bytes need to ship in the Pages artifact.
        env:
          VITE_ASSETS_BASE: https://pub-8bb0622759a042aa9dbd9cb4bd1f21e6.r2.dev
        run: cd web && npm run build

      - name: Copy data/ into build output
        # Quest JSON + stage configs are still in-repo and need to ride
        # along with the Pages artifact. rsync so we merge with any
        # dist/data/ that vite already created via the public symlink.
        run: |
          mkdir -p web/dist/data
          rsync -a --delete data/ web/dist/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
