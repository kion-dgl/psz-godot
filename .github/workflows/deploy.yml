name: Mirror static game assets to DigitalOcean

# No Node site or report service is deployed. GitHub Pages owns the Astro site.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two merges race the droplet; newest wins.
concurrency:
  group: mirror-game-assets
  cancel-in-progress: true

jobs:
  # ── Playable Godot Web build → psz.onl/play (/srv/game) ──────────────────
  deploy-play:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # stamp_version.sh needs the commit count

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          # Non-mono build: Godot 4 .NET/mono CANNOT export to Web (it refuses
          # even for a GDScript project). ci.yml's build job sets this too.
          use-dotnet: false
          include-templates: true

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.5.1

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Stamp build number
        run: bash scripts/tools/stamp_version.sh

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html  # fail loudly if the export produced nothing

      - name: Deploy to droplet (/srv/game)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DO_DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ vars.DO_DEPLOY_TARGET || 'root@159.223.133.93' }}
          DEPLOY_HOST: ${{ vars.DO_DEPLOY_HOST || '159.223.133.93' }}
          GAME_DIR: ${{ vars.DO_GAME_DIR || '/srv/game' }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret DO_DEPLOY_SSH_KEY is not set — add it before this workflow can deploy."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            build/web/ "$DEPLOY_TARGET:$GAME_DIR/"
          echo "✓ static game files mirrored → https://psz.onl/game/"
