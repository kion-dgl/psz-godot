name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue temp branches — required checks must also report there, or
  # every queued PR hangs waiting on checks that never run.
  merge_group: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Import project
        # Raw /assets/ files aren't in the repo (hosted on R2; verify-assets
        # job covers integrity), so imports will log missing-file warnings.
        # Tests exercise config/logic layers and don't need local GLBs.
        run: godot --headless --path . --import --quit || true

      - name: Run tests
        # This step doubles as the GDScript warnings-as-errors gate (#291).
        # The error-level warnings in project.godot's [debug] section make
        # offending scripts print "Warning treated as error" when the runtime
        # recompiles every .gd (test_script_parse loads them all). A warning-as-
        # error does NOT make load() return null at runtime, so we can't rely on
        # the test exit code — we grep the output and fail explicitly.
        run: |
          godot --headless --path . res://scripts/tools/test_runner.tscn 2>&1 | tee /tmp/test_run.log
          rc=${PIPESTATUS[0]}
          if grep -q "Warning treated as error" /tmp/test_run.log; then
            echo "::error::GDScript warnings-as-errors violations (see project.godot [debug]):"
            grep -A1 "Warning treated as error" /tmp/test_run.log
            exit 1
          fi
          exit $rc

      - name: Free-field layout tests
        # Invariant check for the RE-measured Valley free field + Reyburn data
        # (issues #562/#563, spec /states/free-field): trees, door/rotation
        # alignment, key/gate balance, spawn resolution, boss HP.
        run: godot --headless --path . res://scripts/tools/test_field_layout.tscn

  version-check:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Committed version sources must stay the "dev" placeholder
        # Versions are STAMPED AT BUILD TIME (scripts/tools/stamp_version.sh:
        # build = 95 + first-parent commit count, +1 per merged PR) — nothing
        # is bumped per PR, so version merge conflicts are impossible. This
        # check inverts the old "must bump" gate: it fails if anyone hand-edits
        # the placeholder, which would silently pin every future build to one
        # number and re-introduce the conflict cascade.
        run: |
          set -euo pipefail
          fail=0
          if [ "$(tr -d '[:space:]' < VERSION)" != "dev" ]; then
            echo "::error::VERSION must stay 'dev' — build numbers are stamped in CI by scripts/tools/stamp_version.sh, never committed."
            fail=1
          fi
          if ! grep -q '^config/version="dev"$' project.godot; then
            echo "::error::project.godot config/version must stay \"dev\" (stamped at build time)."
            fail=1
          fi
          if ! grep -q '^version/name="dev"$' export_presets.cfg; then
            echo "::error::export_presets.cfg version/name must stay \"dev\" (stamped at build time)."
            fail=1
          fi
          exit $fail

  validate-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validate quest JSON schema
        run: python3 scripts/tools/validate_quests.py

  check-asset-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Verify res://assets/ refs resolve in asset_tree.txt
        run: python3 scripts/tools/check_asset_refs.py

      - name: Verify GLB texture URIs resolve (binary refs check_asset_refs can't see)
        run: python3 scripts/tools/check_glb_textures.py

      - name: Verify repo layout (no root junk; binary assets under sanctioned trees)
        run: python3 scripts/tools/check_repo_layout.py

  code-health:
    # Self-contained (stdlib-only) GDScript graph ratchet — rebuilds the
    # function graph from source every run, so it can't go stale. Fails on NEW
    # near-duplicate functions, dead code (referenced nowhere in .gd/.tscn),
    # complexity hotspots (over the size/cyclomatic bound), god-orchestrators
    # (high call-graph fan-out), or orphan files (committed .gd/.tscn nothing
    # references), each vs a committed baseline, so the existing backlogs don't
    # block. EPIC #295.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dup + dead-code + complexity + coupling ratchet
        run: python3 scripts/tools/code_graph.py --check

      # File-level orphans: committed .gd/.tscn that nothing references (the
      # reverse of check-asset-refs). New orphans fail; existing ones are
      # baselined. Move true orphans to /archive/ (CLAUDE.md). EPIC #295.
      - name: Orphan-file ratchet
        run: python3 scripts/tools/orphan_files.py --check

      # The generator's own output, not the unit tests' view of it: the seeded
      # tests call FieldPopulation.authored_objects directly, so they cannot
      # catch the generator forgetting to call it. This reads the committed
      # dump and asserts every authored object landed inside its room (#591).
      - name: Generated fields carry their authored objects
        run: python3 scripts/tools/check_generated_objects.py

      # Drift guard for data/re_reference/room_objects.json against psz-re.
      # Self-skips (exit 0) when psz-re is not checked out, which is the CI
      # case — it earns its keep on a dev box with $PSZ_RE set, and costs a
      # second here so nobody has to remember to run it (#591).
      - name: Authored-object table has not drifted from psz-re
        run: python3 scripts/tools/refield/import_re_objects.py --check

      # Beta working agreement: accepting debt (growing any baseline) must be
      # loud and deliberate — requires a `Debt-Accepted: <reason>` trailer in
      # a PR commit. Decreases pass silently. spec /engineering.
      - name: Baseline-debt acknowledgment guard (PRs only)
        if: github.event_name == 'pull_request'
        run: BASE_REF=origin/${{ github.base_ref }} python3 scripts/tools/check_baseline_debt.py

  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pack reachable + sidecar matches manifest
        run: python3 scripts/tools/verify_assets_manifest.py

  r2-mirror-check:
    # Fails closed when a PR adds asset files under assets/ or
    # web/public/assets/psobb_sfx/ that aren't yet on R2 (the web build's CDN).
    # Forcing function for `scripts/publish/sync_tree.ts`. Pack/Arweave side is
    # covered by verify-assets; this is the R2/web side.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe added/modified asset paths against R2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/tools/check_r2_mirror.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Type check
        run: cd web && npx tsc --noEmit

      - name: Test
        run: cd web && npm run test

      - name: Build
        # Asset GLBs / textures / audio aren't in the repo; the built site
        # points at Cloudflare R2 for everything under /assets/ via the
        # VITE_ASSETS_BASE env (consumed by web/src/utils/assets.ts).
        env:
          VITE_ASSETS_BASE: https://pub-8bb0622759a042aa9dbd9cb4bd1f21e6.r2.dev
        run: cd web && npm run build

      - name: Copy data/ into build output
        # Quest JSON + stage configs still live in the repo and need to be
        # published alongside the bundle for GitHub Pages. Vite may already
        # have copied them via the web/public/data symlink, so use rsync so
        # we merge into any existing dist/data/ rather than nesting to
        # dist/data/data/ (`cp -r` does the wrong thing when the target
        # directory exists).
        run: |
          mkdir -p web/dist/data
          rsync -a --delete data/ web/dist/data/

  spec:
    # Build the Astro spec/docs site so a broken page fails the PR. astro build
    # compiles every page, which catches the common breakages — a stray `{`/`}`
    # in markup parsed as a JS expression, a bad import, a malformed component —
    # that an HTTP 200 + grep check on the dev server would miss.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/package-lock.json

      - name: Install dependencies
        run: cd spec && npm ci

      - name: Build
        # Asset URLs resolve to a relative /cdn/ path at runtime, so no
        # assets-base env is needed at build time.
        run: cd spec && npm run build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 cmdline-tools;latest ndk;26.3.11579264'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.5.1

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Configure Godot editor settings for Android
        run: |
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.5.tres"
          if [ ! -f "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.tres"
          fi
          # Inject Android SDK, Java, and keystore paths into the Godot-generated settings
          sed -i '/\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_HOME"'"\nexport/android/java_sdk_path = "'"$JAVA_HOME"'"\nexport/android/debug_keystore = "'"$HOME"'/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"' "$SETTINGS_FILE"
          grep -i "android\|java" "$SETTINGS_FILE"

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Linux x86_64
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux x86_64" build/linux/psz-godot.x86_64

      - name: Export Windows x86_64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x86_64" build/windows/psz-godot.exe

      - name: Export Android
        continue-on-error: true
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/psz-godot.apk

      - name: Export macOS
        continue-on-error: true
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" build/macos/psz-godot.zip
