name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Import project
        # Raw /assets/ files aren't in the repo (hosted on R2; verify-assets
        # job covers integrity), so imports will log missing-file warnings.
        # Tests exercise config/logic layers and don't need local GLBs.
        run: godot --headless --path . --import --quit || true

      - name: Run tests
        run: godot --headless --path . res://scripts/tools/test_runner.tscn

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was bumped
        run: |
          PR_VERSION=$(cat VERSION | tr -d '[:space:]')
          MAIN_VERSION=$(git show origin/main:VERSION 2>/dev/null | tr -d '[:space:]' || echo "0.0.0")

          if [ "$PR_VERSION" = "$MAIN_VERSION" ]; then
            echo "::error::VERSION not bumped. Current: $MAIN_VERSION. Bump VERSION and project.godot config/version before merging."
            exit 1
          fi

          echo "Version bumped: $MAIN_VERSION → $PR_VERSION ✓"

  validate-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Validate quest JSON schema
        run: python3 scripts/tools/validate_quests.py

  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect assets_manifest.json change
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="HEAD~1"
            HEAD_SHA="HEAD"
          fi
          if git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null | grep -qx 'assets_manifest.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "manifest changed: ${{ steps.check.outputs.changed }}"

      - name: Verify pack URLs reachable
        if: steps.check.outputs.changed != 'true'
        run: python3 scripts/tools/verify_assets_manifest.py

      - name: Verify pack URLs + sha256 (manifest changed)
        if: steps.check.outputs.changed == 'true'
        run: python3 scripts/tools/verify_assets_manifest.py --download

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Type check
        run: cd web && npx tsc --noEmit

      - name: Test
        run: cd web && npm run test

      - name: Build
        # Asset GLBs / textures / audio aren't in the repo; the built site
        # points at Cloudflare R2 for everything under /assets/ via the
        # VITE_ASSETS_BASE env (consumed by web/src/utils/assets.ts).
        env:
          VITE_ASSETS_BASE: https://pub-8bb0622759a042aa9dbd9cb4bd1f21e6.r2.dev
        run: cd web && npm run build

      - name: Copy data/ into build output
        # Quest JSON + stage configs still live in the repo and need to be
        # copied alongside the bundle for GitHub Pages.
        run: cp -r data/ web/dist/data/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true

      - name: Setup Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34 cmdline-tools;latest ndk;26.3.11579264'

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ hashFiles('**/*.import') }}
          restore-keys: godot-import-

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.5.1

      - name: Import project
        run: godot --headless --path . --import --quit || true

      - name: Configure Godot editor settings for Android
        run: |
          SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.5.tres"
          if [ ! -f "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$HOME/.config/godot/editor_settings-4.tres"
          fi
          # Inject Android SDK, Java, and keystore paths into the Godot-generated settings
          sed -i '/\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_HOME"'"\nexport/android/java_sdk_path = "'"$JAVA_HOME"'"\nexport/android/debug_keystore = "'"$HOME"'/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"' "$SETTINGS_FILE"
          grep -i "android\|java" "$SETTINGS_FILE"

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Linux x86_64
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux x86_64" build/linux/psz-godot.x86_64

      - name: Export Windows x86_64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows x86_64" build/windows/psz-godot.exe

      - name: Export Android
        continue-on-error: true
        run: |
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/psz-godot.apk

      - name: Export macOS
        continue-on-error: true
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" build/macos/psz-godot.zip
